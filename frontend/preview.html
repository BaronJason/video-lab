<!DOCTYPE html>
<html lang="zh-CN" data-skin="Maid_Atelier">
<head>
  <meta charset="UTF-8">
  <title>sidebar ribbon/badge 验证</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="skins/Maid_Atelier.css">
</head>
<body>
  <div style="display:flex;height:100vh">
    <div class="sidebar" style="width:285px;flex-shrink:0">
      <div class="sidebar__root" style="height:100%;overflow:auto">
        <div class="sidebar__tree" id="sidebarTree">
          <div class="tree-project">
            <div class="tree-project__name tree-project__name--sticky is-filled" data-project="A">
              <span class="tree-arrow tree-arrow--open"><svg width="16" height="16"><path d="M0 0H1V1H0Z"/></svg></span>
              <svg class="tree-project__icon" viewBox="0 0 24 24" width="16" height="16"><path d="M0 0H1V1H0Z"/></svg>
              项目A
              <span class="tree-project__badge">共 12 个配置</span>
            </div>
          </div>
          <div class="tree-project">
            <div class="tree-project__name" data-project="B">
              <span class="tree-arrow"><svg width="16" height="16"><path d="M0 0H1V1H0Z"/></svg></span>
              <svg class="tree-project__icon" viewBox="0 0 24 24" width="16" height="16"><path d="M0 0H1V1H0Z"/></svg>
              项目B
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="center-panel" style="flex:1">
      <div class="center-top">
        <div class="center-top__header">
          <span class="center-top__title">日期分支</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

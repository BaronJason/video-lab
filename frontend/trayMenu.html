<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>托盘菜单</title>
<!-- 兜底白蓝样式在前，皮肤变量注入位（style#skinVars）置后：同级 :root 后出现者胜，
     确保主进程注入的皮肤变量能覆盖兜底值 -->
<style>
  :root {
    --bg-base-default: #FFFFFF;
    --text-default: #222222;
    --text-secondary: #555555;
    --border-neutral-l1: #E5E5E5;
    --bg-overlay-l2: rgba(106, 111, 255, 0.10);
    --radius-6: 6px;
    --radius-8: 8px;
    --body-base-font-size: 13px;
    --body-sm-font-size: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow: hidden; background: transparent; -webkit-font-smoothing: antialiased; }
  .tray-menu { padding: 4px; border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-8); background: var(--bg-base-default); }
  .tray-menu button {
    display: block; width: 100%; text-align: left;
    padding: 7px 12px; border: none; border-radius: var(--radius-6);
    background: transparent; color: var(--text-default);
    font-size: 12px; font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    cursor: pointer; white-space: nowrap;
  }
  .tray-menu button:hover { background: var(--bg-overlay-l2); }
  .tray-menu .sep { display: block; height: 1px; margin: 4px 6px; background: var(--border-neutral-l1); }
</style>
<style id="skinVars"></style>
</head>
<body>
<div class="tray-menu" id="trayMenu">
  <button data-action="show_main">显示主窗口</button>
  <span class="sep"></span>
  <button data-action="open_tasks">打开任务列表</button>
  <span class="sep"></span>
  <button data-action="open_settings">设置</button>
  <span class="sep" id="sepUpdate"></span>
  <button data-action="check_update" id="btnUpdate">检查更新</button>
  <span class="sep"></span>
  <button data-action="quit">退出</button>
</div>
<script>
  (function () {
    var api = window.txapi;
    if (!api) return;
    document.getElementById('trayMenu').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-action]');
      if (btn && api.tray_menu_click) api.tray_menu_click(btn.getAttribute('data-action')).catch(function () {});
    });
  })();
</script>
</body>
</html>

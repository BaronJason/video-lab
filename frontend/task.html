<!DOCTYPE html>
<html lang="zh-CN" data-skin="white_blue">
<head>
  <meta charset="UTF-8">
  <title>Video Lab - 任务</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="skins/white_blue.css">
  <link rel="stylesheet" href="skins/Black_Orange.css">
  <link rel="stylesheet" href="skins/Gray_Orange.css">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    .task-header {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; flex-shrink: 0;
      border-bottom: 1px solid var(--border-neutral-l1);
      background: var(--bg-base-secondary);
    }
    .task-header__title { font-size: var(--body-base-font-size); font-weight: var(--font-weight-strong); color: var(--text-default); }
    .task-header__stat { font-size: var(--body-xs-font-size); color: var(--text-tertiary); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-header__clear {
      height: 24px; padding: 0 10px; border: 1px solid var(--border-neutral-l2); border-radius: 4px;
      background: transparent; color: var(--text-secondary); font-family: var(--font-family-default);
      font-size: var(--body-xs-font-size); cursor: pointer; flex-shrink: 0;
    }
    .task-header__clear:hover { background: var(--bg-overlay-l1); color: var(--text-default-hover); }
    .task-list { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; }
    .task-empty { color: var(--text-tertiary); font-size: var(--body-sm-font-size); text-align: center; margin-top: 40px; }
    .task-card { border: 1px solid var(--border-neutral-l1); border-radius: 6px; background: var(--bg-base-secondary); overflow: hidden; flex-shrink: 0; }
    .task-card__header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; user-select: none; }
    .task-card__status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .task-card--running .task-card__status-dot { background: var(--status-primary-default); }
    .task-card--waiting .task-card__status-dot { background: var(--status-warning-default); }
    .task-card--paused .task-card__status-dot { background: var(--status-warning-default); }
    .task-card--done .task-card__status-dot { background: var(--status-success-default); }
    .task-card--error .task-card__status-dot { background: var(--status-error-default); }
    .task-card--stopped .task-card__status-dot { background: var(--text-disabled); }
    .task-card__failreason {
      flex-shrink: 0; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: var(--body-xs-font-size); font-weight: var(--font-weight-strong);
      color: var(--status-error-default);
    }
    .task-card__status-text { font-size: var(--body-xs-font-size); color: var(--text-tertiary); flex-shrink: 0; }
    .task-card__title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--body-sm-font-size); color: var(--text-default); }
    .task-card__tag {
      flex-shrink: 0; padding: 0 6px; height: 16px; line-height: 16px; border-radius: 8px;
      font-size: 10px; background: var(--bg-overlay-l2); color: var(--text-secondary);
    }
    .task-card__lock { flex-shrink: 0; font-size: var(--body-xs-font-size); }
    .task-card__lock--waiting { color: var(--status-warning-default); }
    .task-card__lock--locked { color: var(--status-primary-default); }
    .task-card__lock--released { color: var(--status-success-default); }
    .task-card__time { flex-shrink: 0; font-size: var(--body-xs-font-size); color: var(--text-tertiary); }
    .task-card__pause, .task-card__stop {
      flex-shrink: 0; height: 20px; padding: 0 8px; border-radius: 4px;
      display: inline-flex; align-items: center; gap: 4px;
      font-family: var(--font-family-default); font-size: var(--body-xs-font-size); cursor: pointer;
    }
    .task-card__pause svg, .task-card__stop svg { flex-shrink: 0; }
    .task-card__pause { border: 1px solid var(--status-warning-default); background: transparent; color: var(--status-warning-default); }
    .task-card__pause:hover { background: var(--status-warning-surface-l1); }
    .task-card__pause--resume { border-color: var(--status-success-default); color: var(--status-success-default); }
    .task-card__pause--resume:hover { background: var(--status-success-surface-l1); }
    .task-card__pause:disabled { border-color: var(--border-neutral-l2); color: var(--text-disabled); cursor: default; background: transparent; }
    .task-card__stop { border: 1px solid var(--status-error-default); background: transparent; color: var(--status-error-default); }
    .task-card__stop:hover { background: var(--status-error-surface-l1); }
    .task-card__stop:disabled { border-color: var(--border-neutral-l2); color: var(--text-disabled); cursor: default; background: transparent; }
    .task-card__body { border-top: 1px solid var(--border-neutral-l1); }
    .task-card__progress {
      display: none; flex-direction: column; gap: 4px;
      padding: 0 10px 8px; margin-top: -2px;
    }
    .task-card__progress-text {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      font-size: var(--body-sm-font-size); color: var(--text-default);
      font-variant-numeric: tabular-nums; line-height: 1.4;
    }
    .task-card__progress-pct { flex-shrink: 0; color: var(--text-secondary); }
    .task-card__progress-track { height: 6px; border-radius: 3px; background: var(--bg-overlay-l2); overflow: hidden; }
    .task-card__progress-fill { height: 100%; width: 0; border-radius: 3px; background: var(--status-primary-default); transition: width .3s ease; }
    .task-card__log {
      max-height: 260px; overflow-y: auto; padding: 6px 10px;
      font-family: Consolas, "Courier New", monospace; font-size: 11px; line-height: 1.5;
      color: var(--text-secondary); white-space: pre-wrap; word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="task-header">
    <span class="task-header__title">任务列表</span>
    <span class="task-header__stat" id="taskStat"></span>
    <button class="task-header__clear" id="btnClearFinished">清除已完成</button>
  </div>
  <div class="task-list" id="taskList"></div>
  <script src="task.js"></script>
</body>
</html>

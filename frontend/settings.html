<!DOCTYPE html>
<html lang="zh-CN" data-skin="white_blue">
<head>
  <meta charset="UTF-8">
  <title>Video Lab - 设置</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="skins/white_blue.css">
  <link rel="stylesheet" href="skins/Black_Orange.css">
  <link rel="stylesheet" href="skins/Maid_Atelier.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
<div class="win-titlebar" id="winTitlebar">
  <span class="win-titlebar__title">Video Lab - 设置</span>
  <div class="win-titlebar__controls">
    <button class="win-titlebar__btn win-titlebar__btn--close" data-wctl="close" title="关闭">
      <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3L3 9" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>
<div class="settings-shell">
  <button class="settings-gh" id="btnGitHub" title="打开Github仓库页面">
    <svg viewBox="0 0 16 16" fill="currentColor" width="18" height="18" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </svg>
  </button>

  <aside class="settings-nav">
    <div class="settings-nav__brand">Video Lab</div>
    <button class="settings-nav__item is-active" data-view="general">通用设置</button>
    <button class="settings-nav__item" data-view="batch">批量拼接</button>
    <button class="settings-nav__item" data-view="replica">视频复刻</button>
    <button class="settings-nav__item" data-view="changelog">更新日志</button>
    <button class="settings-nav__item" data-view="about">关于</button>
  </aside>

  <div class="settings-body">

    <!-- ═══ 通用设置 ═══ -->
    <section class="settings-view is-active" id="view-general">
      <h2 class="settings-view__title">通用设置</h2>

      <div class="form-group">
        <label class="form-group__label">主题外观</label>
        <div class="theme-row" id="themeRow"></div>
      </div>

      <div class="form-group">
        <label class="form-group__label">工作路径<small>存放各项目文件夹及 TXT 配置</small></label>
        <div class="dir-row">
          <input class="form-input" id="cfgRoot" type="text" placeholder="">
          <button class="btn btn-ghost" data-dir="cfgRoot">选择目录</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-group__label">开机自启动</label>
        <div class="opt-row">
          <label class="opt-check">
            <input type="checkbox" id="autoStart">
            <span class="opt-check__box"></span>
            <span>开机后台自启动（静默到托盘）</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-group__label">关闭主窗口</label>
        <div class="opt-row">
          <label class="opt-radio">
            <input type="radio" name="closeBehavior" value="exit">
            <span class="opt-radio__dot"></span>
            <span class="opt-radio__label">退出软件</span>
          </label>
        </div>
        <div class="opt-row">
          <label class="opt-radio">
            <input type="radio" name="closeBehavior" value="tray">
            <span class="opt-radio__dot"></span>
            <span class="opt-radio__label">最小化至系统托盘</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <div class="form-group__head">
          <label class="form-group__label">配置和数据保存位置<small>保存后立即生效，配置与 Cache 缓存将一并迁移</small></label>
          <button type="button" class="cfg-open-btn" id="btnOpenCfgDir">打开文件夹</button>
        </div>
        <div class="opt-row">
          <label class="opt-radio">
            <input type="radio" name="configStorage" value="program">
            <span class="opt-radio__dot"></span>
            <span class="opt-radio__label">程序所在目录<span class="opt-path" id="cfgPathProgram"></span></span>
          </label>
        </div>
        <div class="opt-row">
          <label class="opt-radio">
            <input type="radio" name="configStorage" value="appdata">
            <span class="opt-radio__dot"></span>
            <span class="opt-radio__label">AppData 目录<span class="opt-path" id="cfgPathAppdata"></span></span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-group__label">更新</label>
        <div class="opt-row">
          <label class="opt-check">
            <input type="checkbox" id="autoCheckUpdate">
            <span class="opt-check__box"></span>
            <span>启动时自动检查更新</span>
          </label>
        </div>
        <div class="opt-row">
          <label class="opt-radio">
            <input type="radio" name="updateSource" value="gitee">
            <span class="opt-radio__dot"></span>
            <span class="opt-radio__label">码云（Gitee）<span class="opt-path">gitee.com/hirannu/video-lab</span></span>
          </label>
        </div>
        <div class="opt-row">
          <label class="opt-radio">
            <input type="radio" name="updateSource" value="github">
            <span class="opt-radio__dot"></span>
            <span class="opt-radio__label">GitHub<span class="opt-path">github.com/BaronJason/video-lab</span></span>
          </label>
        </div>
        <div class="opt-actions">
          <button class="btn" id="btnCheckUpdate" title="立即检查所选更新源（码云/GitHub）是否有新版本">检查更新</button>
        </div>
      </div>
    </section>

    <!-- ═══ 批量拼接 ═══ -->
    <section class="settings-view" id="view-batch">
      <h2 class="settings-view__title">成片命名规则</h2>

      <div class="form-group">
        <label class="form-group__label">创作者名<small>成片名中的创作者标识</small></label>
        <input class="form-input" id="batchProducer" type="text" placeholder="">
      </div>

      <div class="form-group">
        <label class="form-group__label">提取前缀<small>从 TXT 配置名或素材路径（含文件名）提取的前缀，可留空</small></label>
        <input class="form-input" id="batchTxtPrefix" type="text" placeholder="">
      </div>

      <div class="form-group">
        <label class="form-group__label">后缀<small>成片名末尾的序号标识，可留空</small></label>
        <input class="form-input" id="batchSuffixMark" type="text" placeholder="YX">
      </div>

      <div class="producer-preview__label">成片名预览</div>
      <div class="producer-preview">
        <code class="producer-preview__value" id="batchNamePreview"></code>
      </div>

      <h2 class="settings-view__title">批量拼接参数</h2>

      <div class="form-group">
        <label class="form-group__label">最大成片时长 (秒)</label>
        <input class="form-input" id="batchMaxDuration" type="number" min="1" step="1" placeholder="">
      </div>

      <div class="form-group">
        <label class="form-group__label">重试次数</label>
        <input class="form-input" id="batchMaxRetry" type="number" min="1" step="1" placeholder="">
      </div>

      <div class="form-group">
        <label class="form-group__label">倍速阈值<small>时长超标时的加速倍率上限</small></label>
        <input class="form-input" id="batchSpeedLimit" type="number" min="1" step="0.1" placeholder="">
      </div>
    </section>

    <!-- ═══ 视频复刻 ═══ -->
    <section class="settings-view" id="view-replica">
      <h2 class="settings-view__title">视频复刻参数</h2>

      <div class="form-group">
        <label class="form-group__label">最大成片时长 (秒)</label>
        <input class="form-input" id="replicaMaxDuration" type="number" min="1" step="1" placeholder="">
      </div>

      <div class="form-group">
        <label class="form-group__label">倍速阈值</label>
        <input class="form-input" id="replicaSpeedLimit" type="number" min="1" step="0.1" placeholder="">
      </div>

      <div class="form-group">
        <label class="form-group__label">去重阈值<small>模式2尾部替换需达到的不一致时长占比</small></label>
        <input class="form-input" id="replicaDedupRatio" type="number" min="0" max="1" step="0.05" placeholder="">
      </div>
    </section>

    <!-- ═══ 更新日志 ═══ -->
    <section class="settings-view" id="view-changelog">
      <div class="changelog-box" id="changelogBox"><div class="changelog-hint" id="changelogHint"></div></div>
    </section>

    <!-- ═══ 关于 ═══ -->
    <section class="settings-view" id="view-about">
      <div class="changelog-box" id="aboutBox"><div class="changelog-hint" id="aboutHint"></div></div>
    </section>

    <footer class="settings-footer">
      <span class="settings-footer__status" id="settingsStatus"></span>
      <button class="btn" id="btnClose">关闭</button>
      <button class="btn btn-primary" id="btnSave">保存</button>
    </footer>

    <!-- 有未保存修改时点关闭/退出：在退出按钮上方弹二级确认菜单 -->
    <div class="discard-pop" id="discardPop" style="display:none">
      <div class="discard-pop__arrow"></div>
      <div class="discard-pop__title">有未保存的修改</div>
      <div class="discard-pop__desc">退出将丢弃未保存的修改</div>
      <div class="discard-pop__actions">
        <button class="btn discard-pop__btn" id="discardCancel">取消</button>
        <button class="btn discard-pop__btn discard-pop__btn--primary" id="discardConfirm">确认退出</button>
      </div>
    </div>

    <!-- 检查更新发现新版本：设置页内二次确认是否下载 -->
    <div class="update-confirm-mask" id="updateConfirmMask" style="display:none">
      <div class="update-confirm-pop">
        <div class="update-confirm-pop__title" id="updateConfirmTitle">发现新版本 v1.4.2</div>
        <div class="update-confirm-pop__desc" id="updateConfirmDesc">是否立即下载更新？下载完成后可在主窗口继续操作。</div>
        <div class="update-confirm-pop__actions">
          <button class="btn update-confirm-pop__btn" id="updateConfirmCancel">取消</button>
          <button class="btn update-confirm-pop__btn update-confirm-pop__btn--primary" id="updateConfirmGo">立即更新</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="titlebar.js"></script>
<script src="settings.js"></script>
</body>
</html>

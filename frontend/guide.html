<!DOCTYPE html>
<html lang="zh-CN" data-skin="white_blue">
<head>
  <meta charset="UTF-8">
  <title>Video Lab - 首次设置</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="skins/white_blue.css">
  <link rel="stylesheet" href="skins/Black_Orange.css">
  <link rel="stylesheet" href="skins/Maid_Atelier.css">
  <link rel="stylesheet" href="settings.css">
  <style>
    /* 首次引导窗口：仿设置页布局 + 顶部标题栏与右上角跳过 */
    .guide-shell { display: flex; flex-direction: column; height: 100vh; }
    .guide-head {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-neutral-l1);
      background: var(--bg-base-secondary);
    }
    .guide-head__title {
      font-family: var(--font-family-default);
      font-size: var(--body-base-font-size);
      font-weight: var(--font-weight-strong);
      color: var(--text-default);
    }
    .guide-close { display: none; }
    .guide-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 24px;
    }
    .guide-desc {
      font-family: var(--font-family-default);
      font-size: var(--body-sm-font-size);
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
<div class="win-titlebar" id="winTitlebar">
  <span class="win-titlebar__title">Video Lab - 首次设置</span>
  <div class="win-titlebar__controls">
    <button class="win-titlebar__btn win-titlebar__btn--close" data-wctl="close" title="关闭">
      <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3L3 9" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>
<div class="settings-shell guide-shell">
  <div class="guide-head">
    <div class="guide-head__title">Video Lab 首次设置</div>
  </div>
  <div class="guide-body">
    <div class="guide-desc">
      选择工作路径：这里存放各项目文件夹及 TXT 配置。
    </div>
    <div class="form-group">
      <label class="form-group__label">工作路径<small>存放各项目文件夹及 TXT 配置</small></label>
      <div class="dir-row">
        <input class="form-input" id="guideRoot" type="text" placeholder="请选择工作路径" readonly>
        <button class="btn btn-ghost" id="guidePick">选择目录</button>
      </div>
    </div>
  </div>
  <footer class="settings-footer">
    <span class="settings-footer__status" id="guideStatus"></span>
    <button class="btn btn-primary" id="guideSave">保存并关闭</button>
  </footer>
</div>
<script src="icons.js"></script>
<script src="titlebar.js"></script>
<script src="guide.js"></script>
</body>
</html>
